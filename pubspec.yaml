name: treniday
description: "TreniDay — home calisthenics workouts with streak tracking and gamification."
publish_to: 'none'

version: 0.9.11+41

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.9
  intl: ^0.20.0
  flutter_riverpod: ^3.0.1
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.0
  flutter_timezone: ^5.0.2
  go_router: ^18.0.2
  flutter_svg: ^2.2.4
  audioplayers: ^6.6.0
  # Web Audio for the cues in the browser (web_cue_player_web.dart)
  web: ^1.1.1

  url_launcher: ^6.3.0
  package_info_plus: ^10.2.2

  # Виджет рабочего стола
  home_widget: ^0.10.0
  app_links: ^7.0.0

  # Анимации
  lottie: ^3.3.3

  # Здоровье (Apple Health / Google Health Connect)
  health: ^13.3.1
  share_plus: ^13.3.1
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_ce_generator: ^1.11.1
  build_runner: ^2.15.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#4DA6FF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#4DA6FF"
    theme_color: "#4DA6FF"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/goro/
    - assets/skala/
    - assets/hosts/
    - assets/sounds/
    - assets/animations/
    - assets/icon/